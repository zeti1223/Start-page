<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div id="app">
      <div id="loading">Loading today's cosmic wonder...</div>
      <div id="error" class="hidden"></div>
      
      <div id="background-image"></div>
      
      <div id="search-container">
        <form id="search-form" action="https://www.google.com/search" method="GET">
          <input 
            type="text" 
            name="q" 
            id="search-input" 
            placeholder="Search Google..." 
            autocomplete="off"
          >
        </form>
      </div>
      
      <div id="shortcuts">
        <a href="https://www.youtube.com" class="shortcut" target="_blank">
          <span class="shortcut-icon"><i class="fab fa-youtube"></i></span>
          <span class="shortcut-name">YouTube</span>
        </a>
        <a href="https://github.com" class="shortcut" target="_blank">
          <span class="shortcut-icon"><i class="fab fa-github"></i></span>
          <span class="shortcut-name">GitHub</span>
        </a>
        <a href="https://www.reddit.com" class="shortcut" target="_blank">
          <span class="shortcut-icon"><i class="fab fa-reddit"></i></span>
          <span class="shortcut-name">Reddit</span>
        </a>
        <a href="https://www.linkedin.com" class="shortcut" target="_blank">
          <span class="shortcut-icon"><i class="fab fa-linkedin"></i></span>
          <span class="shortcut-name">LinkedIn</span>
        </a>
        <a href="https://www.twitch.tv" class="shortcut" target="_blank">
          <span class="shortcut-icon"><i class="fab fa-twitch"></i></span>
          <span class="shortcut-name">Twitch</span>
        </a>
        <a href="https://www.spotify.com" class="shortcut" target="_blank">
          <span class="shortcut-icon"><i class="fab fa-spotify"></i></span>
          <span class="shortcut-name">Spotify</span>
        </a>
      </div>
      
      <div id="info-panel" class="hidden">
        <h2 id="title"></h2>
        <p id="explanation"></p>
        <p id="copyright"></p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
